{% set name = "vcrpy" %}
{% set version = "6.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/vcrpy-{{ version }}.tar.gz
  sha256: 9e023fee7f892baa0bbda2f7da7c8ac51165c1c6e38ff8688683a12a4bde9278

build:
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - setuptools
    - pip
    - wheel
  run:
    - python
    - pyyaml
    - wrapt
    - yarl
    - urllib3 <2  # [py<310]

test:
  imports:
    - vcr
    - vcr.persisters
    - vcr.serializers
    - vcr.stubs
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/kevin1024/vcrpy
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Automatically mock your HTTP interactions to simplify and speed up testing
  dev_url: https://github.com/kevin1024/vcrpy
  doc_url: https://vcrpy.readthedocs.io/

extra:
  recipe-maintainers:
    - dopplershift
