{% set name = "vcrpy" %}
{% set version = "7.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/vcrpy-{{ version }}.tar.gz
  sha256: 176391ad0425edde1680c5b20738ea3dc7fb942520a48d2993448050986b3a50

build:
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - setuptools
    - pip
    - wheel
  run:
    - python
    - pyyaml
    - wrapt
    - yarl
    - urllib3  # [py>=310]

test:
  imports:
    - vcr
    - vcr.persisters
    - vcr.serializers
    - vcr.stubs
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/kevin1024/vcrpy
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Automatically mock your HTTP interactions to simplify and speed up testing
  dev_url: https://github.com/kevin1024/vcrpy
  doc_url: https://vcrpy.readthedocs.io/

extra:
  recipe-maintainers:
    - dopplershift
